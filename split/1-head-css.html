:root {
  --ink:        #0a0909;
  --ink-1:      #121110;
  --ink-2:      #1a1817;
  --line:       rgba(245, 245, 245, .10);
  --line-2:     rgba(245, 245, 245, .18);
  --paper:      #f5f5f5;
  --fog:        #8c8781;
  --fog-2:      #b8b3ac;
  --honey:      #ffc202;
  --honey-deep: #fec601;
  --honey-dim:  rgba(255, 194, 2, .16);

  --display: 'Aclonica', 'Arial Black', system-ui, sans-serif;
  --body: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
  --mono: 'JetBrains Mono', 'Cascadia Mono', Consolas, 'SF Mono', ui-monospace, monospace;

  --hex: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  --pad: clamp(20px, 5vw, 76px);
  --r: 22px;
  --ease: cubic-bezier(.22, 1, .36, 1);
}

* { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
          text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
a, button, [role="button"], input, label, summary,
.bv-cell, .bv-cellx, .bv-m, .bv-card {
  touch-action: manipulation;
}

.bv-marquee, .bv-reel, .bv-gal__view,
.bv-marquee__track, .bv-reel__track, .bv-gal__track, .bv-tile, .bv-gal__t {
  touch-action: pan-y;
}

html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

body {
  margin: 0;
  background: var(--ink);
  color: var(--paper);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--honey); outline-offset: 3px; border-radius: 4px; }

.bv-mega,
.bv-h2 {
  font-family: var(--display);
  font-weight: 400;
  line-height: .92;
  letter-spacing: -.02em;
  margin: 0;
}
.bv-mega { font-size: clamp(2.15rem, 6.6vw, 5.4rem); }
.bv-h2   { font-size: clamp(1.62rem, 3.9vw, 2.95rem); }
.bv-h3   { font-family: var(--display); font-weight: 400; font-size: clamp(1.05rem, 1.7vw, 1.35rem); line-height: 1.16; margin: 0; }

.bv-eyebrow {
  font-family: var(--mono);
  font-size: .72rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--honey);
  margin: 0 0 1.1rem;
  display: block;
}
.bv-eyebrow::before { content: '( '; opacity: .5; }
.bv-eyebrow::after  { content: ' )'; opacity: .5; }

.bv-lede { font-size: clamp(.94rem, 1.05vw, 1.06rem); color: var(--fog-2); max-width: 62ch; line-height: 1.62; }
.bv-dim  { color: var(--fog); }
.bv-amber { color: var(--honey); }

.bv-section { padding: clamp(64px, 10vw, 150px) var(--pad); position: relative; scroll-margin-top: 84px; }
.bv-wrap { max-width: 1320px; margin-inline: auto; }
.bv-head { max-width: 900px; margin-bottom: clamp(36px, 5vw, 68px); }

.bv-wrap--bleed { padding-inline: var(--pad); max-width: calc(1320px + 2 * var(--pad)); }

:where(.bv-wrap--measure) > * { max-width: 1040px; }
.bv-rule { height: 1px; background: var(--line); border: 0; margin: 0; }

.bv-hex {
  clip-path: var(--hex);
  -webkit-clip-path: var(--hex);
  background: var(--honey);
  aspect-ratio: 1 / 1.1547;
}

.bv-wash::before {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: .5;
  background-image:
    radial-gradient(circle at 50% 50%, rgba(255, 194, 2, .05) 0 1.5px, transparent 2px);
  background-size: 34px 59px;
  background-position: 0 0, 17px 29px;
  mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, #000 20%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, #000 20%, transparent 75%);
}

.bv-mast {
  position: fixed;
  inset: 0 0 auto;
  z-index: 900;
  display: flex;
  align-items: center;
  gap: 28px;
  padding: max(14px, env(safe-area-inset-top)) max(var(--pad), env(safe-area-inset-right))
           14px max(var(--pad), env(safe-area-inset-left));

  transition: background .4s var(--ease), border-color .4s var(--ease);
  border-bottom: 1px solid transparent;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.bv-mast.is-stuck {
  background: rgba(10, 9, 9, .82);
  border-bottom-color: var(--line);
}
.bv-brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 1.16rem; letter-spacing: -.01em; }
.bv-brand img { width: 34px; height: 34px; object-fit: contain; }
.bv-nav { display: flex; gap: 26px; margin-left: auto; font-size: .85rem; }
.bv-nav a { color: var(--fog-2); position: relative; padding: 4px 0; transition: color .25s; }
.bv-nav a:hover, .bv-nav a.is-here { color: var(--paper); }
.bv-nav a::after {
  content: ''; position: absolute; left: 50%; bottom: 0; height: 2px; width: 0;
  background: var(--honey); transform: translateX(-50%); transition: width .3s var(--ease);
}
.bv-nav a:hover::after, .bv-nav a.is-here::after { width: 100%; }
@media (max-width: 900px) { .bv-nav { display: none; } }

.bv-cta {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 11px 22px; border-radius: 999px;
  background: var(--honey); color: var(--ink);
  font-weight: 700; font-size: .86rem;
  transition: transform .3s var(--ease), box-shadow .3s var(--ease);
}
.bv-cta:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255, 194, 2, .28); }
.bv-cta--ghost { background: transparent; color: var(--paper); border: 1px solid var(--line-2); }
.bv-cta--ghost:hover { background: rgba(245, 245, 245, .06); box-shadow: none; }

.bv-skip {
  position: fixed; top: 10px; left: 10px; z-index: 9970;
  padding: 11px 18px; border-radius: 999px;
  background: var(--honey); color: var(--ink); font-weight: 700; font-size: .86rem;
  transform: translateY(-160%);
  transition: transform .3s var(--ease);
}
.bv-skip:focus-visible { transform: none; }

.bv-burger {
  display: none; margin-left: auto; order: 3;
  width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid var(--line-2);
  align-items: center; justify-content: center; flex-direction: column; gap: 5px;
  background: rgba(10, 9, 9, .5);
  transition: background .3s var(--ease), border-color .3s var(--ease);
}
.bv-burger span {
  display: block; width: 17px; height: 2px; border-radius: 2px; background: var(--paper);
  transition: transform .38s var(--ease), width .38s var(--ease), background .3s;
}
.bv-burger[aria-expanded="true"] { background: var(--honey); border-color: var(--honey); }
.bv-burger[aria-expanded="true"] span { background: var(--ink); }
.bv-burger[aria-expanded="true"] span:first-child { transform: translateY(3.5px) rotate(45deg); }
.bv-burger[aria-expanded="true"] span:last-child  { transform: translateY(-3.5px) rotate(-45deg); }

.bv-menu {
  position: fixed; inset: 0; z-index: 890;
  background: var(--ink);
  display: flex; flex-direction: column; justify-content: center; gap: 30px;
  padding: max(96px, calc(env(safe-area-inset-top) + 82px))
           max(var(--pad), env(safe-area-inset-right))
           max(36px, calc(env(safe-area-inset-bottom) + 20px))
           max(var(--pad), env(safe-area-inset-left));

  overscroll-behavior: contain;
  overflow-y: auto;
  opacity: 0; transition: opacity .38s var(--ease);
}
.bv-menu[hidden] { display: none; }
.bv-menu.is-shown { opacity: 1; }

.bv-menu::before {
  content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .6;
  background-image: radial-gradient(circle at 50% 50%, rgba(255, 194, 2, .06) 0 1.5px, transparent 2px);
  background-size: 34px 59px;
  mask-image: radial-gradient(ellipse 90% 70% at 50% 45%, #000 10%, transparent 78%);
  -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 45%, #000 10%, transparent 78%);
}

.bv-menu__cells { position: relative; display: grid; gap: 4px; }
.bv-menu__cells a {
  display: flex; align-items: baseline; gap: 16px;
  padding: 13px 16px; border-radius: 12px;
  border: 1px solid transparent;
  opacity: 0; transform: translateY(16px);
  transition: opacity .5s var(--ease), transform .5s var(--ease),
              background .25s var(--ease), border-color .25s var(--ease);
}
.bv-menu.is-shown .bv-menu__cells a { opacity: 1; transform: none; }
.bv-menu__cells a:nth-child(1) { transition-delay: .06s; }
.bv-menu__cells a:nth-child(2) { transition-delay: .11s; }
.bv-menu__cells a:nth-child(3) { transition-delay: .16s; }
.bv-menu__cells a:nth-child(4) { transition-delay: .21s; }
.bv-menu__cells a:nth-child(5) { transition-delay: .26s; }
.bv-menu__cells a:nth-child(6) { transition-delay: .31s; }
.bv-menu__cells a:active,
.bv-menu__cells a.is-here { background: rgba(255, 194, 2, .08); border-color: rgba(255, 194, 2, .3); }
.bv-menu__cells i { font-family: var(--mono); font-style: normal; font-size: .72rem; letter-spacing: .12em; color: var(--honey); }
.bv-menu__cells b { font-family: var(--display); font-weight: 400; font-size: clamp(1.35rem, 6vw, 2rem); line-height: 1; }

.bv-menu__foot {
  position: relative; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding-top: 26px; border-top: 1px solid var(--line); font-size: .84rem;
  opacity: 0; transition: opacity .5s var(--ease) .34s;
}
.bv-menu.is-shown .bv-menu__foot { opacity: 1; }

@media (max-width: 900px) {
  .bv-burger { display: flex; }

  .bv-mast__cta { display: none; }
}
@media (min-width: 901px) { .bv-menu { display: none; } }
@media (prefers-reduced-motion: reduce) {
  .bv-menu__cells a { transform: none !important; }
}

.bv-prog {
  position: fixed; inset: 0 0 auto; height: 2px; z-index: 950;
  background: linear-gradient(90deg, var(--honey), #ffe27a 55%, var(--honey));
  transform: scaleX(0); transform-origin: 0 50%;
  will-change: transform; pointer-events: none;
}

.bv-boot {
  position: fixed; inset: 0; z-index: 9990;
  background: var(--ink);
  display: grid; place-items: center; gap: 26px; align-content: center;
  transition: opacity .5s var(--ease), visibility .5s;
}
.bv-boot.is-done { opacity: 0; visibility: hidden; pointer-events: none; }
.bv-boot__mark { width: 78px; height: 90px; }
.bv-boot__mark path { stroke-dasharray: 400; stroke-dashoffset: 400; }
.bv-boot.is-drawing path { transition: stroke-dashoffset 1.15s var(--ease); stroke-dashoffset: 0; }
.bv-boot.is-drawing path + path { transition-delay: .18s; }
.bv-boot__n {
  font-family: var(--display); font-size: 2.1rem; color: var(--paper);
  display: flex; align-items: baseline; gap: 2px;
}
.bv-boot__n i { font-style: normal; font-size: .9rem; color: var(--honey); }
.bv-boot__bar { width: min(210px, 44vw); height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bv-boot__bar span {
  display: block; height: 100%; width: 100%;
  background: linear-gradient(90deg, var(--honey), #ffe27a);
  transform: scaleX(0); transform-origin: 0 50%;
}

body.bv-booting { overflow: hidden; }

.bv-cursor { position: fixed; left: 0; top: 0; z-index: 9995; pointer-events: none; opacity: 0; transition: opacity .3s; }
.bv-cursor.is-live { opacity: 1; }
.bv-cursor__dot {
  position: absolute; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
  border-radius: 50%; background: var(--honey);
}
.bv-cursor__ring {
  position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px;
  border-radius: 50%; border: 1px solid rgba(255, 194, 2, .55);
  transition: width .3s var(--ease), height .3s var(--ease), margin .3s var(--ease),
              background .3s var(--ease), border-color .3s var(--ease);
}
.bv-cursor.is-hot .bv-cursor__ring {
  width: 72px; height: 72px; margin: -36px 0 0 -36px;
  background: rgba(255, 194, 2, .14); border-color: var(--honey);
}
.bv-cursor__label {
  position: absolute; left: 0; top: 0;
  font-family: var(--mono); font-size: .58rem; letter-spacing: .13em; text-transform: uppercase;
  color: var(--honey); opacity: 0; transition: opacity .25s var(--ease);
  white-space: nowrap;
}
.bv-cursor.is-hot .bv-cursor__label { opacity: 1; }
.bv-cursor.is-down .bv-cursor__ring { width: 26px; height: 26px; margin: -13px 0 0 -13px; background: rgba(255,194,2,.3); }

.bv-reel, .bv-gal__view { cursor: grab; }
.bv-reel.is-dragging, .bv-gal.is-dragging .bv-gal__view { cursor: grabbing; }
.bv-gal.is-dragging .bv-gal__t, .bv-reel.is-dragging .bv-tile { pointer-events: none; }
@media (hover: none), (max-width: 900px) { .bv-cursor { display: none; } }

body.bv-lb-open .bv-gal__track,
body.bv-lb-open .bv-marquee__track,
body.bv-lb-open .bv-reel__track { animation-play-state: paused !important; }

.bv-drip {
  position: fixed; left: max(14px, 2vw); top: 96px; bottom: 40px; width: 2px;
  z-index: 880; pointer-events: none;
  background: linear-gradient(var(--line), rgba(245,245,245,.03));
  border-radius: 2px;
}
.bv-drip__fill {
  position: absolute; inset: 0; transform-origin: 50% 0; transform: scaleY(0);
  background: linear-gradient(180deg, rgba(255,194,2,.25), var(--honey) 45%, var(--honey-deep));
  border-radius: 2px;
}
.bv-drip__bead {
  position: absolute; left: 50%; top: 0; width: 11px; height: 13px;
  margin-left: -5.5px;
  background: var(--honey);

  border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
  box-shadow: 0 0 16px 3px rgba(255, 194, 2, .45);
  transform: translateY(0) scaleY(1);
}
@media (max-width: 1180px) { .bv-drip { display: none; } }
@media (prefers-reduced-motion: reduce) { .bv-drip__bead { display: none; } }

.bv-hero {
  min-height: 100svh;
  display: flex; flex-direction: column; justify-content: center;
  padding: 130px var(--pad) 60px;
  position: relative; overflow: hidden;
}

.bv-hero__video,
.bv-hero__comb {
  position: absolute; inset: 0; width: 100%; height: 100%;
  z-index: 0; pointer-events: none;
}
.bv-hero__video { object-fit: cover; opacity: .5; }

.bv-hero__photo {
  position: absolute; inset: -8% -4%; z-index: 0; pointer-events: none;

  background-image: var(--hero-wide);
  background-size: cover;
  background-position: 62% 50%;
  will-change: transform;
}
.bv-hero__photo--base { opacity: .20; filter: saturate(.7) brightness(.75); }
.bv-hero__photo--lit {
  opacity: .92; filter: saturate(1.15) contrast(1.05);
  --mx: 70%; --my: 45%; --torch: 30vmax;
  -webkit-mask-image: radial-gradient(circle var(--torch) at var(--mx) var(--my), #000 0%, rgba(0,0,0,.55) 42%, transparent 72%);
          mask-image: radial-gradient(circle var(--torch) at var(--mx) var(--my), #000 0%, rgba(0,0,0,.55) 42%, transparent 72%);
}
@media (max-width: 760px) {
  .bv-hero__photo { background-image: var(--hero-tall); background-position: 50% 18%; }
  .bv-hero__photo--lit { --torch: 42vmax; }
}
@media (prefers-reduced-motion: reduce) {
  .bv-hero__photo--lit { -webkit-mask-image: none; mask-image: none; opacity: .3; }
}
.bv-hero__scrim {
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background:
    linear-gradient(90deg, var(--ink) 4%, rgba(10,9,9,.72) 42%, rgba(10,9,9,.25) 74%),
    linear-gradient(to top, var(--ink) 1%, transparent 34%);
}
.bv-hero__glow {
  position: absolute; z-index: 0; pointer-events: none;
  width: 78vw; height: 78vw; max-width: 900px; max-height: 900px;
  right: -14vw; top: 50%; transform: translateY(-50%);
  background: radial-gradient(circle, rgba(255, 194, 2, .14) 0%, transparent 62%);
}
.bv-hero__inner { position: relative; z-index: 1; max-width: 1320px; margin-inline: auto; width: 100%; }
.bv-hero__lede { margin: 26px 0 34px; }
.bv-hero__actions { display: flex; gap: 12px; flex-wrap: wrap; }

.bv-ltr { display: inline-block; opacity: 0; transform: translateY(.5em) rotate(3deg); }
.is-lit .bv-ltr { animation: bv-rise .7s var(--ease) forwards; }
@keyframes bv-rise { to { opacity: 1; transform: none; } }

.bv-scrollcue {
  margin-top: clamp(34px, 6vw, 70px);
  font-family: var(--mono); font-size: .68rem; letter-spacing: .2em;
  color: var(--fog); display: flex; align-items: center; gap: 12px;
}
.bv-scrollcue span { width: 54px; height: 1px; background: var(--honey); transform-origin: left; animation: bv-cue 2.2s ease-in-out infinite; }
@keyframes bv-cue { 0%, 100% { transform: scaleX(.35); opacity: .5; } 50% { transform: scaleX(1); opacity: 1; } }

.bv-marquee { overflow: hidden; border-block: 1px solid var(--line); padding: 20px 0; display: flex; }
.bv-marquee__track { display: flex; flex-shrink: 0; gap: 40px; padding-right: 40px; align-items: center; animation: bv-slide var(--dur, 34s) linear infinite; }
.bv-marquee:hover .bv-marquee__track { animation-play-state: paused; }
@keyframes bv-slide { to { transform: translateX(-100%); } }

.js-strips .bv-marquee__track,
.js-strips .bv-reel__track,
.js-strips .bv-gal__track { animation: none !important; }

.bv-marquee { --skew: 0deg; }
.bv-marquee__item, .bv-marquee__dot {
  transform: skewX(var(--skew));
  transition: transform .18s linear;
}
.bv-marquee__item { font-family: var(--display); font-size: clamp(.95rem, 1.6vw, 1.45rem); white-space: nowrap; color: var(--paper); }
.bv-marquee__dot { color: var(--honey); font-size: 1.1rem; }
.bv-marquee--rev .bv-marquee__track { animation-direction: reverse; }

.bv-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.bv-stat { background: var(--ink); padding: clamp(22px, 3.2vw, 40px); }
.bv-stat__v { font-family: var(--display); font-size: clamp(1.5rem, 3vw, 2.45rem); line-height: 1; color: var(--honey); }
.bv-stat__l { font-family: var(--mono); font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--fog); margin-top: 10px; }
.bv-stat__n { font-size: .82rem; color: var(--fog-2); margin-top: 12px; line-height: 1.45; }
@media (max-width: 860px) { .bv-stats { grid-template-columns: repeat(2, 1fr); } }

.bv-comb {
  display: flex; align-items: flex-start; justify-content: flex-start;
  gap: clamp(6px, 1.1vw, 16px);
  margin-top: clamp(30px, 4vw, 54px);
}
.bv-cell {
  position: relative; flex: 1 1 0; min-width: 0;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding: 0; border: 0; background: none; cursor: pointer;

  transform: translateY(var(--drop, 0px)) scale(1);
  transition: transform .55s var(--ease);
}
.bv-cell:nth-child(even) { --drop: clamp(22px, 3vw, 44px); }
.bv-cell.is-on { transform: translateY(var(--drop, 0px)) scale(1.1); }

.bv-cell__hex {
  position: relative; width: 100%; max-width: 108px;
  aspect-ratio: 1 / 1.1547;
  clip-path: var(--hex); -webkit-clip-path: var(--hex);
  background: var(--ink-2);
  display: grid; place-items: center;
  transition: background .4s var(--ease), box-shadow .4s var(--ease);
}

.bv-cell__fill {
  position: absolute; inset: 0; transform-origin: 50% 100%;
  transform: scaleY(var(--f, 0));
  background: linear-gradient(180deg, #ffe27a 0%, var(--honey) 42%, var(--honey-deep) 100%);
  transition: transform .6s var(--ease);
}
.bv-cell__n {
  position: relative; z-index: 1;
  font-family: var(--display); font-size: clamp(.9rem, 1.5vw, 1.25rem);
  color: var(--fog); transition: color .35s var(--ease);
}

.bv-cell.is-filled .bv-cell__n { color: var(--ink); }
.bv-cell.is-on .bv-cell__hex { box-shadow: 0 0 0 1px rgba(255,194,2,.5), 0 14px 40px rgba(255,194,2,.22); }
.bv-cell__t {
  font-family: var(--display); font-size: clamp(.68rem, .95vw, .92rem);
  text-align: center; color: var(--fog); line-height: 1.2;
  transition: color .35s var(--ease);
}
.bv-cell.is-filled .bv-cell__t,
.bv-cell.is-on .bv-cell__t,
.bv-cell:hover .bv-cell__t { color: var(--paper); }
.bv-cell:hover .bv-cell__hex { background: var(--ink-2); box-shadow: 0 0 0 1px var(--line-2); }

.bv-stage {
  display: grid; grid-template-columns: auto 1fr; gap: clamp(16px, 2.4vw, 34px);
  align-items: start;
  margin-top: clamp(46px, 6vw, 84px);
  padding-top: clamp(22px, 3vw, 34px);
  border-top: 1px solid var(--line);
  min-height: 108px;
}
.bv-stage__no {
  font-family: var(--display); font-size: clamp(2.2rem, 6vw, 4.4rem);
  line-height: .8; color: var(--honey);
}
.bv-stage__t { font-family: var(--display); font-size: clamp(1.1rem, 2.2vw, 1.7rem); margin-bottom: 8px; }
.bv-stage__d { color: var(--fog-2); font-size: clamp(.9rem, 1.3vw, 1.05rem); max-width: 62ch; line-height: 1.55; }
.bv-stage__no, .bv-stage__t, .bv-stage__d { transition: opacity .3s var(--ease), transform .3s var(--ease); }
.bv-stage.is-swapping .bv-stage__no,
.bv-stage.is-swapping .bv-stage__t,
.bv-stage.is-swapping .bv-stage__d { opacity: 0; transform: translateY(9px); }

@media (max-width: 760px) {
  .bv-comb { flex-wrap: wrap; justify-content: center; gap: 14px 10px; }
  .bv-cell { flex: 0 0 28%; }
  .bv-cell:nth-child(even) { --drop: 0px; }
  .bv-stage { grid-template-columns: 1fr; }
}

.bv-pin { position: relative; scroll-margin-top: 84px; }
.bv-pin__rail { height: 300vh; }
.bv-pin__stage {
  position: sticky; top: 0; min-height: 100svh;
  display: flex; align-items: center;
  padding: 110px var(--pad) 70px;
}

.bv-pin__stage > .bv-wrap { width: 100%; }

@media (min-width: 1180px) {
  .bv-pin__stage > .bv-wrap {
    display: grid;
    grid-template-columns: minmax(320px, .92fr) minmax(0, 1.08fr);
    column-gap: clamp(40px, 5vw, 88px);
    align-items: start;
  }
  #method .bv-head { grid-column: 1; grid-row: 1 / span 3; align-self: center; margin-bottom: 0; max-width: none; }
  #hive            { grid-column: 2; grid-row: 1; margin-top: 0; }
  #stagePanel      { grid-column: 2; grid-row: 2; }
  #method .bv-pin__meter { grid-column: 2; grid-row: 3; }
}
.bv-pin__meter {
  margin-top: clamp(28px, 4vw, 46px);
  height: 2px; background: var(--line); border-radius: 2px; overflow: hidden;
}
.bv-pin__meter span {
  display: block; height: 100%; width: 100%;
  background: linear-gradient(90deg, var(--honey), #ffe27a);
  transform: scaleX(0); transform-origin: 0 50%;
}

@media (max-width: 900px) {
  .bv-pin__rail { height: auto; }
  .bv-pin__stage { position: static; min-height: 0; padding: clamp(64px, 10vw, 120px) var(--pad); }
}
@media (prefers-reduced-motion: reduce) {
  .bv-pin__rail { height: auto; }
  .bv-pin__stage { position: static; min-height: 0; }
}

.bv-svc { border-top: 1px solid var(--line); }
.bv-svc__row {
  display: grid; grid-template-columns: 78px 1fr 1.3fr; gap: 20px; align-items: baseline;
  padding: clamp(20px, 2.6vw, 32px) 0; border-bottom: 1px solid var(--line);
  transition: background .35s var(--ease), padding-inline .35s var(--ease);
}
.bv-svc__row:hover { background: rgba(255, 194, 2, .04); padding-inline: 16px; }
.bv-svc__n { font-family: var(--mono); font-size: .78rem; color: var(--honey); }
.bv-svc__t { font-family: var(--display); font-size: clamp(1rem, 1.45vw, 1.25rem); }
.bv-svc__d { color: var(--fog); font-size: .92rem; }
@media (max-width: 760px) { .bv-svc__row { grid-template-columns: 46px 1fr; } .bv-svc__d { grid-column: 2; } }

.bv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
@media (max-width: 1080px) { .bv-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px)  { .bv-grid { grid-template-columns: 1fr; } }

.bv-card {
  position: relative; display: block; width: 100%; text-align: left;
  border: 1px solid var(--line); border-radius: var(--r); overflow: hidden;
  background: var(--ink-1);
  transition: transform .45s var(--ease), border-color .45s var(--ease);
}
.bv-card:hover { transform: translateY(-6px); border-color: var(--a, var(--honey)); }
.bv-card__img { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: var(--ink-2); }
.bv-card__img img { width: 100%; height: 100%; object-fit: cover; object-position: top; transition: transform .8s var(--ease), filter .5s; filter: grayscale(.35); }
.bv-card:hover .bv-card__img img { transform: scale(1.06); filter: grayscale(0); }
.bv-card__veil { position: absolute; inset: 0; background: linear-gradient(to top, var(--ink) 2%, rgba(10,9,9,.35) 42%, transparent 72%); }

.bv-card__plate {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 8%;
  background:
    radial-gradient(circle at 50% 42%, rgba(255, 194, 2, .10), transparent 65%),
    var(--ink-2);
}
.bv-card__plate img {
  max-width: 100%; max-height: 100%; object-fit: contain;

  filter: saturate(.55); opacity: .88;
  transition: filter .5s var(--ease), opacity .5s var(--ease), transform .6s var(--ease);
}
.bv-card:hover .bv-card__plate img { filter: none; opacity: 1; transform: scale(1.05); }

.bv-card__mark {
  position: absolute; inset: 0; display: grid; place-items: center;
  background: radial-gradient(circle at 50% 45%, rgba(255, 194, 2, .07), transparent 62%);
}
.bv-card__mark .bv-hex {
  width: 92px; background: var(--a, var(--honey)); opacity: .16;
  transition: opacity .5s var(--ease), transform .6s var(--ease);
}
.bv-card:hover .bv-card__mark .bv-hex { opacity: .3; transform: rotate(30deg) scale(1.06); }
.bv-card__mark b {
  position: absolute; font-family: var(--display); font-weight: 400;
  font-size: 2.4rem; color: var(--a, var(--honey));
}
.bv-card__tag {
  position: absolute; top: 14px; left: 14px; z-index: 2;
  font-family: var(--mono); font-size: .62rem; letter-spacing: .12em; text-transform: uppercase;
  padding: 5px 11px; border-radius: 999px;
  background: rgba(10, 9, 9, .7); border: 1px solid var(--line-2); color: var(--a, var(--honey));
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.bv-card__body { padding: 20px 22px 24px; }
.bv-card__meta { font-family: var(--mono); font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; color: var(--fog); margin-bottom: 9px; }
.bv-card__t { font-family: var(--display); font-size: 1.1rem; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bv-card__t svg { flex: none; transition: transform .4s var(--ease); color: var(--a, var(--honey)); }
.bv-card:hover .bv-card__t svg { transform: rotate(45deg); }
.bv-card__o { margin-top: 12px; font-size: .86rem; color: var(--fog-2); line-height: 1.5; }
.bv-card__kind {
  display: inline-block; margin-top: 14px;
  font-family: var(--mono); font-size: .6rem; letter-spacing: .13em; text-transform: uppercase;
  padding: 4px 9px; border-radius: 5px;
}
.bv-kind--result { background: var(--honey); color: var(--ink); }
.bv-kind--goal   { background: transparent; color: var(--fog); border: 1px solid var(--line-2); }

.bv-reel,
.bv-marquee,
.bv-gal:not([data-mode="grid"]) .bv-gal__view {
  --fade: clamp(24px, 6vw, 120px);
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 var(--fade), #000 calc(100% - var(--fade)), transparent 100%);
          mask-image: linear-gradient(90deg, transparent 0, #000 var(--fade), #000 calc(100% - var(--fade)), transparent 100%);
}

.bv-gal:not([data-mode="grid"]) .bv-gal__view { --fade: clamp(16px, 2vw, 40px); }

.bv-reel { overflow: hidden; display: flex; margin-bottom: 14px; }
.bv-reel__track { display: flex; flex-shrink: 0; gap: 14px; padding-right: 14px; animation: bv-slide var(--dur, 64s) linear infinite; }
.bv-reel:hover .bv-reel__track { animation-play-state: paused; }
.bv-reel--rev .bv-reel__track { animation-direction: reverse; }
.bv-tile {
  width: clamp(150px, 17vw, 232px); flex: none;
  aspect-ratio: 4 / 5; border-radius: 14px; overflow: hidden;
  border: 1px solid var(--line); background: var(--ink-2);
  position: relative; cursor: zoom-in;
}
.bv-tile img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s var(--ease); }

.bv-tile, .bv-gal__t, .bv-card__img {
  background-image: linear-gradient(100deg,
    var(--ink-2) 0 38%, rgba(255, 194, 2, .07) 50%, var(--ink-2) 62% 100%);
  background-size: 260% 100%;
  animation: bv-shimmer 2.4s ease-in-out infinite;
}
@keyframes bv-shimmer { from { background-position: 130% 0; } to { background-position: -130% 0; } }

.bv-tile.is-loaded, .bv-gal__t.is-loaded, .bv-card__img.is-loaded { animation: none; background-image: none; }

html.bv-js .bv-tile img { opacity: 0; transition: opacity .55s var(--ease), transform .6s var(--ease); }
html.bv-js .bv-tile img.is-loaded { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  .bv-tile, .bv-gal__t, .bv-card__img { animation: none; }
  html.bv-js .bv-tile img { opacity: 1 !important; }
}
.bv-tile:hover img { transform: scale(1.07); }
.bv-tile::after {
  content: attr(data-c); position: absolute; inset: auto 0 0; padding: 22px 12px 10px;
  font-family: var(--mono); font-size: .6rem; letter-spacing: .1em; text-transform: uppercase;
  color: var(--paper); background: linear-gradient(to top, rgba(10,9,9,.92), transparent);
  opacity: 0; transition: opacity .35s;
}
.bv-tile:hover::after { opacity: 1; }

.bv-quote { font-family: var(--display); font-size: clamp(1.2rem, 2.5vw, 2.05rem); line-height: 1.28; letter-spacing: -.015em; }
.bv-quote__who { font-family: var(--mono); font-size: .74rem; letter-spacing: .13em; text-transform: uppercase; color: var(--fog); margin-top: 26px; }

.bv-foot { padding: clamp(48px, 6vw, 80px) var(--pad) 40px; border-top: 1px solid var(--line); position: relative; overflow: hidden; }
.bv-foot__grid { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 40px; max-width: 1320px; margin-inline: auto; position: relative; z-index: 1; }
.bv-foot h3 { font-family: var(--mono); font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; color: var(--fog); margin: 0 0 16px; }
.bv-foot ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 3px; font-size: .9rem; }

.bv-foot li a { display: inline-block; padding-block: 3px; }
