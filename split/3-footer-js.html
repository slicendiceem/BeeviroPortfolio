/* ==== js/perf.js ================================================== */
/* Beeviro — performance tiering.
 *
 * WHY THIS FILE EXISTS. The first round of feedback on this site was, in
 * substance, one sentence: it is beautiful and it is too heavy. A hero canvas
 * repainting a few hundred hexagons a frame, nineteen 3D cells, six looping
 * videos, four running strips, a pointer companion, per-card tilt and a
 * scroll-scrubbed pinned section are individually cheap and collectively a
 * slideshow on a mid-range phone.
 *
 * So the page now decides, before a single effect starts, how much motion this
 * device can actually afford — and the reader can overrule it either way. There
 * are two tiers:
 *
 *   full  — everything as designed.
 *   lite  — no hero canvas, no 3D lattice videos, no pointer companion, no
 *           per-card tilt, no magnetic buttons, no decode scramble, no cell
 *           turnover, shorter boot, fewer carousel tiles. The page keeps its
 *           layout, its colour and its scroll reveals; it stops burning frames.
 *
 * This script must run BEFORE the rest, so everything downstream can simply
 * ask `BV_PERF.lite` and never build the expensive thing in the first place.
 * Tearing an effect down after the fact is how you end up with half a canvas.
 */
(function () {
  'use strict';

  var html = document.documentElement;
  var KEY = 'bv:motion';                 // 'full' | 'lite' | absent = automatic
  var nav = navigator;

  /* ---- viewport-fit, for the build that has no <head> of its own ----------
     The stylesheet keeps every piece of fixed chrome out of the notch with
     env(safe-area-inset-*), and all of that is inert unless the viewport meta
     says `viewport-fit=cover`. The standalone build says so in its markup —
     but build-embed.mjs DROPS <head>, because GoHighLevel owns the title and
     the meta tags, so the hosted build arrived with no viewport meta at all:
     the insets resolved to 0 and iOS letterboxed the page beside the notch.

     So it is asserted here instead, in the first script in the document,
     before anything has been laid out. Appended rather than replaced — GHL may
     have written its own scale settings into that tag and they are not ours to
     throw away — and idempotent, so the standalone build, which already has
     it, is untouched. */
  (function coverTheScreen() {
    try {
      var m = document.querySelector('meta[name="viewport"]');
      if (!m) {
        m = document.createElement('meta');
        m.name = 'viewport';
        m.content = 'width=device-width, initial-scale=1';
        (document.head || document.documentElement).appendChild(m);
      }
      if (!/viewport-fit\s*=\s*cover/i.test(m.content)) {
        m.content = m.content.replace(/\s*,\s*$/, '') + ', viewport-fit=cover';
      }
    } catch (e) { /* no head yet, or a locked-down embed: the page still works */ }
  }());

  function stored() {
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  }
  function remember(v) {
    try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch (e) {}
  }

  /* ---- what this device looks like ---------------------------------------
     Every signal here is a hint and several are absent on Safari, so they vote
     rather than decide. Two weak signals is enough to go lite: being wrong
     towards "smooth" costs a few effects, being wrong towards "heavy" costs the
     whole page. */
  function auto() {
    var votes = 0;
    var conn = nav.connection || nav.mozConnection || nav.webkitConnection;

    if (conn && conn.saveData) return true;                       // explicit ask
    if (conn && /(^|-)2g$/.test(conn.effectiveType || '')) return true;

    var mem = nav.deviceMemory;                 // Chromium only, in GB, capped 8
    if (mem && mem <= 4) votes += mem <= 2 ? 2 : 1;

    var cpu = nav.hardwareConcurrency;
    if (cpu && cpu <= 4) votes += cpu <= 2 ? 2 : 1;

    // A coarse pointer on a small screen is a phone, and a phone is where every
    // one of these effects is most expensive and least visible.
    var coarse = matchMedia('(pointer: coarse)').matches;
    if (coarse && innerWidth < 1000) votes += 2;
    else if (coarse) votes += 1;

    if (conn && /(^|-)3g$/.test(conn.effectiveType || '')) votes += 1;

    // A very high pixel ratio multiplies every fill this page does.
    if ((window.devicePixelRatio || 1) >= 3 && coarse) votes += 1;

    return votes >= 2;
  }

  var choice = stored();
  var lite = choice === 'lite' ? true : choice === 'full' ? false : auto();

  var API = {
    lite: lite,
    auto: !choice,
    reduced: matchMedia('(prefers-reduced-motion: reduce)').matches,
    /* Anything holding a rAF loop should call this each frame and bail when it
       returns true, so a runtime downgrade actually stops the work. */
    stopped: function () { return API.lite; },
    listeners: [],
    on: function (fn) { API.listeners.push(fn); },
    set: function (on, sticky) {
      if (API.lite === !!on) { if (sticky) remember(on ? 'lite' : 'full'); return; }
      API.lite = !!on;
      if (sticky) { API.auto = false; remember(on ? 'lite' : 'full'); }
      paint();
      API.listeners.forEach(function (fn) { try { fn(API.lite); } catch (e) {} });
    },
  };

  /* Set once, at load, and never changed. Anything that alters LAYOUT or removes
     an element the reader may already be looking at is scoped to this class in
     the stylesheet, so a mid-session demotion can only ever switch off per-frame
     work — it cannot un-pin a section under somebody's scroll position, and it
     cannot take away the pointer they are using. */
  if (lite) html.classList.add('bv-lite-boot');

  function paint() {
    html.classList.toggle('bv-lite', API.lite);
    html.classList.toggle('bv-full', !API.lite);
    var btns = document.querySelectorAll('[data-perf-toggle]');
    Array.prototype.forEach.call(btns, function (b) {
      b.setAttribute('aria-pressed', String(!API.lite));
      b.classList.toggle('is-lite', API.lite);
    });
  }
  paint();
  window.BV_PERF = API;

  /* ---- the watchdog -------------------------------------------------------
     Device hints miss plenty — a four-year-old laptop reports 8 cores and 8 GB
     and still cannot paint this. So measure the real thing: once the boot
     screen is out of the way, count frames for three seconds. Under ~42fps the
     page demotes itself. Only ever downgrades, never promotes, and never writes
     to storage — an automatic decision must not become a permanent one the
     reader cannot see or undo. */
  if (!API.lite && !API.reduced) {
    /* CONSERVATIVE ON PURPOSE. The first version sampled one 3-second window
       starting 2.6s in, and demoted under 42fps — which is precisely the window
       where the page is worst and least representative: the boot screen has just
       lifted, nineteen cell images are decoding, six videos are being fetched
       and the first reveals are running. It fired on machines that were fine,
       and a demotion is not a free action — it visibly changes the page under
       someone who is reading it.
       So: start after that burst has passed, and require TWO consecutive bad
       windows. A single stutter is a stutter; two in a row is a slow device. */
    var START = 6000, WINDOW = 2500, FLOOR = 36, NEEDED = 2;
    setTimeout(function () {
      var bad = 0;

      function sample() {
        var frames = 0, t0 = 0;
        requestAnimationFrame(function first(t) {
          t0 = t;
          requestAnimationFrame(function tick(now) {
            frames++;
            if (now - t0 < WINDOW) { requestAnimationFrame(tick); return; }
            // A backgrounded tab throttles rAF to a crawl. That is the browser
            // being sensible, not the device being slow — do not count it.
            if (document.hidden) { bad = 0; sample(); return; }
            var fps = frames / ((now - t0) / 1000);
            bad = fps < FLOOR ? bad + 1 : 0;
            if (bad < NEEDED) { sample(); return; }
            if (!API.auto) return;
            API.set(true, false);
            html.classList.add('bv-lite-auto');
          });
        });
      }
      sample();
    }, START);
  }

  /* ---- the control --------------------------------------------------------
     Wired here rather than in the motion layer because it has to work even if
     everything downstream failed to load. */
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-perf-toggle]');
    if (!b) return;
    e.preventDefault();
    API.set(!API.lite, true);
    // Effects are built at load, so the honest thing is to rebuild the page
    // rather than pretend a half-torn-down canvas is the same experience.
    location.reload();
  });
})();

/* ==== js/i18n.js ================================================== */
/* Beeviro — bilingual layer (English · العربية).
 *
 * Beeviro works in Egypt, Saudi Arabia, the UAE and Qatar. A portfolio for that
 * market that only reads in English is asking most of its audience to do the
 * translating, so the whole site — chrome, section copy, and all twenty-five
 * case files — reads in Arabic too, right to left.
 *
 * HOW IT WORKS, AND WHY THIS WAY
 *
 * 1. Language is decided HERE, before beeviro.js renders anything. Every string
 *    the page builds comes from T(), and the client records are merged with
 *    clients.ar.js in place. Nothing downstream has to know there are two
 *    languages; it just reads BV_CLIENTS and asks T() for its labels.
 *
 * 2. Switching language RELOADS the page. Half this site is generated markup —
 *    twenty-five dossiers, four running strips, a nineteen-cell lattice, all
 *    measured in pixels at build time — and re-rendering it live in the other
 *    direction is how you get a mirrored layout with unmirrored measurements.
 *    One reload is honest and correct.
 *
 * 3. The Arabic data is an OVERLAY (see clients.ar.js). A missing translation
 *    falls back to English rather than to an empty box, so a half-finished
 *    record degrades to a readable one.
 *
 * DIRECTION IS NOT A TRANSLATION PROBLEM. `dir="rtl"` is set on <html> so the
 * browser handles bidi for us, and the stylesheet's [dir="rtl"] block flips the
 * handful of things that are positioned rather than flowed — the drip rail, the
 * dossier rail border, the marquee travel, the card arrow.
 */
(function () {
  'use strict';

  var KEY = 'bv:lang';
  var SUPPORTED = ['en', 'ar'];

  function stored() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function remember(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }

  /* A ?lang= or #lang= in the URL wins, so a link can be shared in a specific
     language — which is the whole point of sending someone a case file. */
  function fromUrl() {
    var m = /[?&#]lang=(ar|en)\b/i.exec(location.href);
    return m ? m[1].toLowerCase() : null;
  }

  /* js/lang.js decides this in the <head>, so `dir` is on <html> before the
     stylesheet lays anything out and the Arabic data is only fetched in Arabic.
     The resolution is repeated here only as a fallback for the case where that
     file failed to load — same rules, same order, one source of truth for the
     ANSWER even though the code appears twice. */
  var LANG = window.BV_LANG;
  if (SUPPORTED.indexOf(LANG) < 0) LANG = fromUrl() || stored();
  if (SUPPORTED.indexOf(LANG) < 0) {
    LANG = /^ar\b/i.test(navigator.language || '') ? 'ar' : 'en';
  }

  var RTL = LANG === 'ar';
  var html = document.documentElement;
  html.setAttribute('lang', LANG);
  html.setAttribute('dir', RTL ? 'rtl' : 'ltr');
  html.classList.toggle('bv-ar', RTL);

  /* ---- the dictionary -----------------------------------------------------
     Only strings the PAGE owns. Client copy lives in clients.js/clients.ar.js
     where it belongs, next to the record it describes. */

            var r = im.getBoundingClientRect();
            return r.right > 0 && r.left < innerWidth && r.width > 0;
          })[0] || all[0] || null;
        }, list.map(function (t) { return t.name; }));
      });
    }
    var half = Math.ceil(mixed.length / 2);
    fill('reelA', mixed.slice(0, half));
    fill('reelB', mixed.slice(half));
  })();

  /* Spread the running shelf into a grid and back, animating each tile from
     exactly where it was — FLIP: measure First, change layout, measure Last,
     apply the inverse as a transform, then release it to zero. */
  function wireSpread(gal, n) {
    var btn = gal.querySelector('.bv-gal__toggle');
    var label = gal.querySelector('.bv-gal__toggleT');
    var track = gal.querySelector('.bv-gal__track');
    if (!btn || !track) return;

    btn.addEventListener('click', function () {
      var toGrid = gal.getAttribute('data-mode') === 'reel';
      var tiles = Array.prototype.slice.call(track.querySelectorAll('.bv-gal__t'));
      var first = tiles.map(function (t) { return t.getBoundingClientRect(); });

      gal.setAttribute('data-mode', toGrid ? 'grid' : 'reel');
      label.textContent = toGrid ? T('case.run') : T('case.spread', { n: n });
      btn.setAttribute('aria-pressed', String(toGrid));

      // Park the running strip NOW, before the new layout is measured. The
      // driver would otherwise zero the track on its next frame and every tile
      // would jump by that offset just as the animation started. Coming back to
      // the run, hold it still until the tiles have landed, then let it go.
      var strip = gal.__bvStrip;
      if (strip) {
        strip.off = 0;
        strip.fling = 0;
        for (var k = 0; k < strip.tracks.length; k++) {
          strip.tracks[k].style.transform = 'translateX(0px)';
        }
        strip.hold = true;
      }

      var last = tiles.map(function (t) { return t.getBoundingClientRect(); });
      tiles.forEach(function (t, i) {
        var dx = first[i].left - last[i].left;
        var dy = first[i].top - last[i].top;
        var sx = first[i].width / (last[i].width || 1);
        var sy = first[i].height / (last[i].height || 1);
        t.style.transition = 'none';
        t.style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) +
          'px) scale(' + sx.toFixed(4) + ',' + sy.toFixed(4) + ')';
      });

      void track.offsetWidth;                       // flush the inverse

      tiles.forEach(function (t, i) {
        t.style.transition = 'transform .62s cubic-bezier(.22,1,.36,1) ' +
          (i * 0.024).toFixed(3) + 's, opacity .4s';
        t.style.transform = '';
      });
      // Hand control back to CSS so :hover works again, and release the strip
      // only once the tiles have landed — otherwise the run resumes underneath
      // a transition that is still moving toward a target that has shifted.
      setTimeout(function () {
        tiles.forEach(function (t) { t.style.transition = ''; t.style.transform = ''; });
        if (strip) strip.hold = false;
      }, 620 + tiles.length * 24 + 120);
    });
  }

  /* ── modal focus plumbing ─────────────────────────────────────────────── */
  /* Both overlays cover the page completely. Without this, Tab keeps walking
     the 25 cards and 350 tiles still sitting behind them, a screen reader
     reads straight through, and closing drops focus back at <body>. */
  var FOCUSABLE = 'a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])';
  var bgLayers = ['mast', 'menu'].map(function (id) { return document.getElementById(id); })
    .concat([document.querySelector('main'), document.querySelector('.bv-foot')])
    .filter(Boolean);

  /* THE PAGE BEHIND AN OVERLAY IS NOT VISIBLE, SO STOP PAYING FOR IT.
     This already meant "hidden from assistive technology". It now also means
     hidden from the renderer, because those are the same fact and the site was
     only acting on one of them.

     A dossier covers the screen, and behind it the hero canvas kept repainting
     a few hundred hexagons every frame, the comb kept oscillating with six
     videos decoding inside it, four strips kept writing transforms and the drip
     rail kept animating — all of it invisible, all of it competing with the
     open animation the reader is actually looking at. Under a 4x CPU throttle
     that was 2.5 seconds of blocked main thread for one case open.

     One signal, broadcast once per state change rather than polled per frame:
     everything expensive listens for `bv:cover` and stops. New effects get this
     for free, which is the point — the previous arrangement had each loop
     inventing its own idea of when it was allowed to run, and a case file was
     not on anybody's list.

     NOT the pointer companion: the honey cursor is drawn ON TOP of the overlay
     and has to keep tracking. "Covered" means the page behind, not the chrome
     in front. */
  var covered = false;
  function setCovered(on) {
    on = !!on;
    if (on === covered) return;
    covered = on;
    document.documentElement.classList.toggle('bv-covered', on);
    try {
      document.dispatchEvent(new CustomEvent('bv:cover', { detail: { covered: on } }));
    } catch (e) {
      var ev2 = document.createEvent('CustomEvent');       // very old engines
      ev2.initCustomEvent('bv:cover', false, false, { covered: on });
      document.dispatchEvent(ev2);
    }
  }
  window.BV_COVERED = function () { return covered; };

  function hideBackground(on) {
    bgLayers.forEach(function (n) {
      if (on) n.setAttribute('aria-hidden', 'true');
      else n.removeAttribute('aria-hidden');
    });
    setCovered(on);
  }

  // Wrap Tab at the ends of one container. Recomputed per keypress because the
  // dossier rebuilds its whole panel when you walk to the next client.
  function trapTab(root, e) {
    if (e.key !== 'Tab') return;
    var items = Array.prototype.filter.call(root.querySelectorAll(FOCUSABLE), function (n) {
      return n.offsetWidth || n.offsetHeight || n.getClientRects().length;
    });
    if (!items.length) return;
    var first = items[0], last = items[items.length - 1];
    if (e.shiftKey && (document.activeElement === first || !root.contains(document.activeElement))) {
      e.preventDefault(); last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault(); first.focus();
    }
  }

  /* ── case dossier ─────────────────────────────────────────────────────── */
  var caseEl = document.getElementById('case');
  var panel = document.getElementById('casePanel');
  var current = -1;
  var caseReturn = null;      // what to give focus back to when it closes

  /* Object URLs for dossier films, keyed by the url they were fetched from, and
     BOUNDED. An object URL is only released by revokeObjectURL — dropping the
     <video> that used it does nothing — so without this a reader who plays
     films in several case files retains every one of them, half a megabyte at a
     time. Three is enough to make going back to the case you just left free
     while capping what is held at roughly 1.5 MB. */
  var filmBlobs = {};
  var filmOrder = [];
  var FILM_CACHE = 3;
  function keepFilmBlob(url, obj) {
    filmBlobs[url] = obj;
    filmOrder.push(url);
    while (filmOrder.length > FILM_CACHE) {
      var old = filmOrder.shift();
      if (filmBlobs[old] && old !== url) {
        URL.revokeObjectURL(filmBlobs[old]);
        delete filmBlobs[old];
      }
    }
  }

  function buildCase(c, idx) {
    // Release the previous shelf before its markup is thrown away.
    var oldGal = panel.querySelector('.bv-gal');
    if (oldGal && window.BV_STRIPS) window.BV_STRIPS.drop(oldGal);

    document.getElementById('caseNo').textContent = T('case.n', {
      i: String(idx + 1).padStart(2, '0'), n: String(C.length).padStart(2, '0'),
    });
    document.getElementById('caseName').textContent = c.name;

    var steps = document.getElementById('caseSteps');
    steps.innerHTML = '';
    STAGES.forEach(function (s, i) {
      var li = el('li');
      var b = el('button', '', '<span class="bv-case__pip"></span>' + esc(s.label));
      b.addEventListener('click', function () {
        var t = panel.querySelector('[data-step="' + s.key + '"]');
        if (t) panel.scrollTo({ top: t.offsetTop - 12, behavior: 'smooth' });
      });
      li.appendChild(b);
      steps.appendChild(li);
    });

    // The rail had a screen-height gap between the last step and the nav
    // buttons. These are the facts a reader scanning the dossier wants pinned
    // where they can always see them, rather than only in the masthead they
    // have already scrolled past.
    var facts = document.getElementById('caseFacts');
    if (facts) {
      var rows = [[T('case.sector'), c.industry], [T('case.market'), c.country],
        [T('case.year'), c.year]];
      if (c.site) rows.push([T('case.site'), c.site]);
      facts.innerHTML = rows.map(function (r) {
        return '<div><dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd></div>';
      }).join('');
    }

    var h = '';
    var shelfHtml = '';                 // the work shelf, mounted after the open

    /* masthead */
    h += '<div class="bv-case__mast">' +
      '<div class="bv-case__meta">' + esc(c.industry) + ' · ' + esc(c.country) + ' · ' + esc(c.year) +
        (c.site ? ' · ' + esc(c.site) : '') + '</div>' +
      '<h2 class="bv-case__tagline">' + bidi(c.tagline) + '</h2>' +
      '<p class="bv-lede">' + bidi(c.summary) + '</p>' +
      '<div class="bv-case__chips">' +
        c.services.map(function (s) { return '<span class="bv-chip">' + esc(s) + '</span>'; }).join('') +
      '</div></div>';

    /* outcome band */
    h += '<div class="bv-case__sec"><h3>' +
      esc(T(c.outcome.kind === 'result' ? 'case.result' : 'case.goal')) +
      '</h3><div class="bv-case__tagline bv-case__out" style="color:' +
      c.accent + '">' + bidi(c.outcome.headline) + '</div>' +
      (c.outcome.kind === 'goal'
        ? '<p class="bv-dim bv-case__caveat">' + esc(T('case.goalNote')) + '</p>'
        : '') + '</div>';

    /* metrics */
    if (c.metrics && c.metrics.length) {
      h += '<div class="bv-case__sec"><h3>' + esc(T('case.metrics')) + '</h3><div class="bv-mx">';
      c.metrics.forEach(function (m) {
        h += '<button class="bv-m"><span class="bv-m__in">' +
          '<span class="bv-m__f"><span class="bv-m__hint">' + esc(T('case.tap')) + '</span>' +
            '<span class="bv-m__v">' + esc(m.v) + '</span>' +
            '<span class="bv-m__l">' + esc(m.l) + '</span></span>' +
          '<span class="bv-m__b"><span class="bv-m__n">' + bidi(m.note) + '</span></span>' +
          '</span></button>';
      });
      h += '</div></div>';
    }

    /* the journey */
    h += '<div class="bv-case__sec"><h3>' + esc(T('case.journey')) + '</h3><div class="bv-journey">';
    STAGES.forEach(function (s, i) {
      var body = (c.journey && c.journey[s.key]) || '';
      if (!body) return;
      h += '<div class="bv-step" data-step="' + s.key + '">' +
        (i < STAGES.length - 1 ? '<span class="bv-step__line"><i></i></span>' : '') +
        '<div><div class="bv-step__hex">' + String(i + 1).padStart(2, '0') + '</div></div>' +
        '<div><div class="bv-step__t">' + esc(s.label) + '</div>' +
        '<div class="bv-step__b">' + bidi(body) + '</div></div></div>';
    });
    h += '</div></div>';

    /* campaign readout */
    if (c.campaign) {
      h += '<div class="bv-case__sec"><h3>' + esc(T('case.campaign')) + '</h3><div class="bv-camp">' +
        '<div class="bv-camp__h">' + esc(c.campaign.title) + '</div><div class="bv-camp__rows">';
      c.campaign.rows.forEach(function (r) {
        h += '<div class="bv-camp__c"><div class="bv-camp__v">' + esc(r[1]) +
          '</div><div class="bv-camp__k">' + esc(r[0]) + '</div></div>';
      });
      h += '</div><div class="bv-camp__f">' + bidi(c.campaign.split) + '</div></div>' +
        '<div class="bv-redact"><b>&nbsp;' + esc(T('case.redacted')) + '&nbsp;</b> ' +
        bidi(c.campaign.note) + '</div></div>';
    }

    /* the film ---------------------------------------------------------------
       Fifteen of the twenty-five dossiers describe video deliverables and show
       still frames of them — Volt EMS's own copy apologises for it. Where the
       actual reel exists, it goes here, ABOVE the stills, because for these
       clients the film IS the deliverable and the gallery is a poster of it.

       Poster-first: nothing loads until somebody presses play, so a dossier is
       no heavier to open than it was. media(), not thumb() — the hero comb gets
       the 288px copy, this gets the full 420px file, because here it is being
       watched rather than glimpsed in a hexagon. */
    if (c.film && c.film.src) {
      /* The poster is the client's own first gallery image — usually already
         cached, and for a client like Volt EMS it is literally a frame of this
         film. But a client whose ENTIRE engagement was video has no gallery:
         Dar El Hadith is work: 0, so this fell back to src="", which browsers
         resolve against the page URL and then fetch and fail. An explicit
         film.poster covers that case; with neither, draw no <img> at all and
         let the block's own background stand. */
      var poster = c.film.poster ? thumb(c.film.poster) : (c.work ? shotSmall(c, 1) : '');
      h += '<div class="bv-case__sec"><h3>' + esc(T('case.film')) + '</h3>' +
        '<div class="bv-film" data-src="' + esc(media(c.film.src)) + '" style="--a:' + c.accent + '">' +
          (poster ? '<img class="bv-film__poster" loading="lazy" decoding="async" src="' +
            esc(poster) + '" alt="">' : '') +
          '<button class="bv-film__play" type="button" data-cursor="' + esc(T('case.filmPlay')) + '">' +
            '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
              '<path d="M8 5v14l11-7z"/></svg>' +
            '<span>' + esc(T('case.filmPlay')) + '</span>' +
          '</button>' +
        '</div>' +
        (c.film.note ? '<p class="bv-film__note bv-dim">' + bidi(c.film.note) + '</p>' : '') +
        '</div>';
    }

    /* the work — a running shelf that can spread into a grid */
    if (c.work) {
      var tiles = '';
      for (var i = 1; i <= c.work; i++) {
        /* NOT lazy: the shelf sizes each tile from its image's natural width, so
           a lazy image deadlocks — zero width means "not visible", which means
           it never loads, which means it never gets a width.

           Which is exactly why the TIER matters here more than anywhere else.
           Every one of these decodes during the open animation, and this was
           asking for the full-size ~1200px original — sixteen of them for a
           client like Moafa, on the critical path of the one transition the
           reader is watching. The shelf is ~370px tall; the 480px copy is the
           same tiering the cards and carousel tiles already use.
           The LIGHTBOX still opens the full-size file, which is the surface
           where the work is actually being looked at — same split as the home
           carousel, where the tile is a thumbnail and the enlargement is not.
           decoding="async" so a decode cannot block the frame either. */
        tiles += '<button class="bv-gal__t" data-cursor="' + esc(T('cursor.view')) +
          '" data-i="' + (i - 1) + '">' +
          '<img decoding="async" src="' + shotSmall(c, i) + '" alt="' + esc(c.name) +
          ' creative ' + i + '"></button>';
      }
      /* THE SHELF IS BUILT, BUT NOT YET. It is the heaviest part of a dossier —
         up to thirty-two tiles and their decodes, a strip registration and two
         full re-measures — and at the moment a case opens it is a screen and a
         half below the fold. Putting it in the same innerHTML as the masthead
         meant all of that landed inside the open transition, which is the one
         animation the reader is actually watching.
         So the markup is prepared here and mounted after the panel has settled;
         see mountShelf(). Nothing about the result differs, only when it costs. */
      shelfHtml = '<div class="bv-case__sec"><h3>' + esc(T('case.work', { n: c.work })) +
        (c.workNote ? ' — ' + bidi(c.workNote) : '') + '</h3>' +
        /* --dur is written here as a CONCRETE value, not as
           calc(var(--n) * 2.2s) in the stylesheet, because the strip driver
           reads it with parseFloat(getComputedStyle(el).getPropertyValue()) —
           and an unregistered custom property computes to its raw token
           sequence, so parseFloat("calc(8 * 2.2s)") is NaN and the shelf
           silently falls back to the 40s default.

           Per TILE rather than a flat duration: speed is width/duration, so one
           number for every shelf means a sixteen-piece gallery runs four times
           faster than a four-piece one. 2.4s a tile keeps the pace the same
           whatever the client delivered. */
        '<div class="bv-gal" data-mode="reel" style="--n:' + c.work +
          '; --dur:' + (Math.max(4, c.work) * 2.4).toFixed(1) + 's">' +
          '<div class="bv-gal__view">' +
            '<div class="bv-gal__track">' + tiles + '</div>' +
            // second copy makes the -50% loop seamless; hidden when spread
            '<div class="bv-gal__track bv-gal__track--ghost" aria-hidden="true">' + tiles + '</div>' +
          '</div>' +
          '<button class="bv-gal__toggle" type="button">' +
            '<span class="bv-gal__toggleT">' + esc(T('case.spread', { n: c.work })) + '</span>' +
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
              '<path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></svg>' +
          '</button>' +
        '</div></div>';
      // A place to put it, so the panel's height is roughly right from the start
      // and mounting the shelf does not shove the journey around underneath the
      // reader. contain-intrinsic-size on the slot does the reserving.
      h += '<div class="bv-case__sec bv-shelf-slot" aria-hidden="true"></div>';
    }

    panel.innerHTML = h;
    panel.scrollTop = 0;

    /* metric flip */
    Array.prototype.forEach.call(panel.querySelectorAll('.bv-m'), function (b) {
      b.addEventListener('click', function () { b.classList.toggle('is-flipped'); });
    });

    /* the film: nothing is fetched until it is asked for --------------------- */
    var film = panel.querySelector('.bv-film');
    if (film) {
      film.addEventListener('click', function () {
        if (film.classList.contains('is-playing')) return;
        film.classList.add('is-playing', 'is-loading');
        var v = document.createElement('video');
        v.controls = true; v.loop = true; v.playsInline = true;
        v.setAttribute('playsinline', '');
        v.preload = 'auto';
        // Same defence as the hero comb: fetched as page data and handed over as
        // a blob, so a download manager has no media URL to offer.
        v.setAttribute('controlslist', 'nodownload noplaybackrate noremoteplayback nofullscreen');
        v.disablePictureInPicture = true;
        // iOS ignores controlsList and the Fullscreen API both; it fires its own
        // webkitbeginfullscreen instead, so that gets caught per element.
        window.BV_NO_FULLSCREEN && window.BV_NO_FULLSCREEN(v);
        v.addEventListener('loadeddata', function () { film.classList.remove('is-loading'); });
        var url = film.getAttribute('data-src');
        /* CACHED BY URL, exactly like the hero comb's reels (hive.js).
           `panel.innerHTML` is replaced on the next dossier open, which throws
           the <video> away but does NOT release its object URL — the ~400-500 KB
           blob behind it stays alive for the life of the document. Walk eight
           case files and that is several megabytes retained on the device class
           this whole site exists to protect. Keying the cache by url also stops
           the same film being downloaded again every time a reader reopens the
           same case. */
        if (filmBlobs[url]) {
          v.src = filmBlobs[url];
          var p0 = v.play();
          if (p0 && p0.catch) p0.catch(function () {});
          film.appendChild(v);
          return;
        }
        fetch(url, { credentials: 'omit', mode: 'cors' })
          .then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); })
          .then(function (b) {
            keepFilmBlob(url, URL.createObjectURL(b));
            v.src = filmBlobs[url];
          })
          .catch(function () { v.src = url; })     // CORS or offline: play it anyway
          .then(function () {
            var p = v.play();
            if (p && p.catch) p.catch(function () {});
          });
        film.appendChild(v);
      });
    }

    /* gallery: lightbox, hover pop, blur-to-sharp, and the spread toggle.
       Mounted after the open transition rather than during it — see shelfHtml.
       Guarded so it can only ever run once per build, because the deep-link and
       the settle timer can both reach it. */
    function mountShelf() {
      var slot = panel.querySelector('.bv-shelf-slot');
      if (!slot || !shelfHtml) return;
      slot.insertAdjacentHTML('beforebegin', shelfHtml);
      slot.parentNode.removeChild(slot);
      shelfHtml = '';
      var gal = panel.querySelector('.bv-gal');
      if (!gal) return;
      var list = [];
      for (var g = 1; g <= c.work; g++) list.push(shot(c, g));

      var realTrack = gal.querySelector('.bv-gal__track:not(.bv-gal__track--ghost)');
      var originAt = function (i) {
        var t = realTrack.querySelectorAll('.bv-gal__t')[i];
        return t ? t.querySelector('img') : null;
      };
      gal.addEventListener('click', function (e) {
        var b = hitAt(e, '.bv-gal__t', gal);
        if (b) openLb(list, Number(b.getAttribute('data-i')), originAt, c.name);
      });

      // Hovering a tile pauses the run so it can be looked at.
      var view = gal.querySelector('.bv-gal__view');
      view.addEventListener('pointerover', function (e) {
        if (e.target.closest('.bv-gal__t')) gal.classList.add('is-held');
      });
      view.addEventListener('pointerout', function (e) {
        if (!view.contains(e.relatedTarget)) gal.classList.remove('is-held');
      });

      wireSpread(gal, c.work);
      // Hand the shelf to the strip driver so it can be dragged, freeze with
      // everything else while a picture is open, and stop dead when spread.
      // motion.js defines BV_STRIPS and loads AFTER this file, so a `#case=`
      // deep link builds a shelf before it exists — retry rather than give up,
      // or that shelf silently never enrols.
      (function enrol(tries) {
        if (window.BV_STRIPS) { window.BV_STRIPS.add(gal); return; }
        if (tries > 0) setTimeout(function () { enrol(tries - 1); }, 120);
      })(15);

      var gio = new IntersectionObserver(function (es) {
        es.forEach(function (e) {
          if (!e.isIntersecting) return;
          var img = e.target;
          var lift = function () { img.classList.add('is-sharp'); };
          img.complete ? setTimeout(lift, 60) : img.addEventListener('load', lift, { once: true });
          gio.unobserve(img);
        });
      }, { root: panel, threshold: 0.05 });
      Array.prototype.forEach.call(gal.querySelectorAll('img'), function (im) { gio.observe(im); });
    }

    /* WHEN. requestIdleCallback lands it in the first gap after the transition;
       the timeout is the guarantee that a busy main thread cannot postpone the
       shelf indefinitely, and the setTimeout is the fallback for Safari, which
       still has no rIC. Either way the reader is looking at the top of a dossier
       a screen and a half above this. */
    if (window.requestIdleCallback) requestIdleCallback(mountShelf, { timeout: 700 });
    else setTimeout(mountShelf, 420);
    // Anything that needs the shelf NOW — a spread toggle, a deep link, a test —
    // can force it rather than wait.
    panel.__bvMountShelf = mountShelf;

    trackJourney();
  }

  /* ── the journey rail ─────────────────────────────────────────────────────
     REPORTED BUG: scrolling a case did not light the whole journey on the side
     rail. Two causes, both in the IntersectionObserver this replaces.

     1. `threshold: 0.45` means 45% of the STEP has to be visible. Several
        journey steps are taller than 45% of the panel, so their ratio can never
        reach 0.45 and they never lit at all. Izar's diagnosis paragraph is one.
     2. The callback fired on threshold crossings in BOTH directions, and
        `isIntersecting` is true at ratio 0.44 as well as 0.46 — so a step
        LEAVING upward re-claimed the highlight from the step arriving below it,
        and the rail walked backwards.

     Position is a scroll question, so it is answered by reading the scroll.
     Every stage the reader has passed stays lit, the current one is marked
     separately, and a spine fills behind the list — so the rail shows progress
     through the journey rather than one lamp hopping about. */
  var journeyOff = null;
  function trackJourney() {
    if (journeyOff) { journeyOff(); journeyOff = null; }

    var stepEls = Array.prototype.slice.call(panel.querySelectorAll('.bv-step'));
    var btns = Array.prototype.slice.call(document.querySelectorAll('#caseSteps button'));
    var spine = document.getElementById('caseSpine');
    if (!stepEls.length || !btns.length) {
      if (spine) spine.style.transform = 'scaleY(0)';

/* ==== js/hive.js ================================================== */
/* Beeviro — the revolving comb in the hero.
   A honeycomb cluster of REAL client work. Six cells play actual client reels;
   the rest hold stills and quietly turn over to new pieces.

   Loaded after clients.js and beeviro.js. If anything here fails the hero is
   still a complete design — the photo, canvas comb and copy stand on their own.

   Three things this file is careful about:

   1. THE NAME IS NOT INSIDE THE HEXAGON. A pointy-top hex tapers to a single
      point at the bottom, which is exactly where a bottom-anchored caption
      sits, so every label was being clipped by the clip-path and long names
      ("SpeakUp English Training") lost whole lines. The readout is a separate
      element outside the 3D context, positioned beside whichever cell is hot.

   2. THE POOL IS CHEAP, NOT NARROW. It used to walk all ~176 gallery images at
      full size, one every 2.6s, so a reader who lingered downloaded the whole
      gallery through the hero. It still walks every client's gallery — 178
      pieces across 22 clients, one client at a time — and nextPiece() skips any
      brand already in another cell, so no client holds two hexagons at once.
      What keeps it cheap is the tier, not the count: cells resolve through
      BV_CELL to 200px WebP, and nothing is fetched until a cell turns over.

   3. NOTHING IS CREATED PER TURN. Each face keeps its <img> for the life of the
      cell and only its `src` changes. */
(function () {
  'use strict';

  var host = document.getElementById('hive3d');
  var tilt = document.getElementById('hiveTilt');
  var lattice = document.getElementById('lattice');
  var read = document.getElementById('hiveRead');
  if (!host || !lattice || !window.BV_CLIENTS) return;

  var REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var LITE = !!(window.BV_PERF && window.BV_PERF.lite);
  var RICH = !REDUCED && !LITE;
  var FINE = matchMedia('(hover: hover) and (pointer: fine)').matches;
  var T = window.T || function (k) { return k; };
  var C = window.BV_CLIENTS;
  var byslug = {};
  C.forEach(function (c) { byslug[c.slug] = c; });

  // Clients whose reels were transcoded down to cell size. Six looping videos
  // decoding behind a headline is the single most expensive thing on this page,
  // so on the lite tier the comb is all stills — same lattice, same work, no
  // video decoders.
  /* Six of the nineteen cells play a real client reel. Rino's Kitchen came out
     on review — the frame that landed in the comb read as a dish on a dark
     counter and said nothing about the work. MasterCraft went in for it; its
     420px cut was already in the library, only the 288px copy was missing.
     Every slug here needs an entry in small/ (tools/shrink-reels.mjs) or the
     comb streams the full file into a 116px hexagon. */
  var REELS = RICH ? ['freestyle', 'kinetic-health', 'eqbal', 'master-craft', 'daily-box', 'beeviro'] : [];

  // same resolver the rest of the site uses; falls back to the local path
  var asset = window.BV_ASSET || function (p) { return p; };

  // a 117px hexagon was ten times the download and ten times the decode, and
  // even the 480px card thumbnail is four times too much here.
  var small = window.BV_CELL || window.BV_THUMB || asset;
  // The reels have their own light copy (300px, tools/shrink-reels.mjs) and it
  // lives in the same table the card thumbnails use.
  var reel = window.BV_THUMB || asset;
  var shot = function (slug, i) {
    return small('assets/work/' + slug + '/' + String(i).padStart(2, '0') + '.jpg');
  };

  /* ---- the pool ---------------------------------------------------------------
     Reviewed as "the cells repeat projects, and the material is not the best we
     have". Both were the same cause: the pool was images 01 and 02 of each
     client — 44 pieces, taken in filename order, for 19 cells that turn over
     every few seconds.

     brand cannot come back until every other brand has had a turn, and every
     piece gets used rather than only whichever two sorted first. That is 178
     pieces across 22 clients. (181 thumbnails exist on disk; three of them are
     Beeviro's own work, which is not a client record and never enters the pool.)

     longer to come back round, but it did not change what happens when it does:
     it lands on a brand that is still sitting in another cell, and the comb
     shows the same client twice at once. Cells also turn over on a timer that
     picks one at random, so nothing about WHICH cell is rewritten has any
     relation to what is currently displayed. "The cells repeat projects" is the
     note this whole pass answers, so the pool being bigger is not enough — the
     guard is what makes it true rather than merely unlikely.

     tracked alongside them: a parallel list is one more thing that can drift out
     of step with what the reader is actually looking at.

     page. Those are seeded from REELS because during build() the reel cells may

     reel cells to clash with.

    var stepY = H * 0.755;

    /* Which cells get a real client reel.
       The old rule was `(r * 5 + c) % 4 === 1`, which on a 3-4-5-4-3 cluster

      var n = ROWS[r];

      for (var c = 0; c < n; c++) {
        k++;

        btn.className = 'bv-cellx';
        btn.type = 'button';
        btn.style.width = W + 'px';

      v.addEventListener('canplay', function () {
        var p = v.play();
        if (p && p.catch) p.catch(function () {});
      });
      attachVideo(v, rec.video, rec.videoFull);
      return v;
    }
    var img = document.createElement('img');
    img.loading = 'lazy';
    img.decoding = 'async';
    img.alt = '';
    if (rec.src) img.src = rec.src;
    return img;
  }

  /* ---- the readout ------------------------------------------------------------
     One shared panel, OUTSIDE the lattice and outside the 3D context, so it is
     never clipped by a hexagon and never sheared by the revolve. Positioned
     beside the hot cell, flipping side and clamping vertically to stay on
     screen — which is what makes a 24-character client name possible at all. */
  var readName = read && read.querySelector('.bv-hive__read-n');
  var readSec = read && read.querySelector('.bv-hive__read-s');
  var readOut = read && read.querySelector('.bv-hive__read-o');
  var readGo = read && read.querySelector('.bv-hive__read-go b');

  function showRead(cell) {
    if (!read) return;
    var c = recordFor(cell.slug);
    if (!c) return;
    readName.textContent = c.name;
    readSec.textContent = c.industry;
    readOut.textContent = c.outcome ? c.outcome.headline : '';
    read.style.setProperty('--a', c.accent || 'var(--honey)');
    read.classList.toggle('is-self', c === SELF);
    // Beeviro's own showreel has no dossier — it must not promise a case. Set
    // in JS rather than a CSS ::before so it exists in both languages.
    if (readGo) readGo.textContent = T(c === SELF ? 'hive.selfCta' : 'card.open');

    // measure after the text is in, so the panel's own height is current
    read.classList.add('is-on');
    var r = cell.el.getBoundingClientRect();
    var p = read.getBoundingClientRect();
    var gap = 14;

    var left = r.right + gap;
    if (left + p.width > innerWidth - 16) left = r.left - gap - p.width;
    if (left < 16) left = Math.min(innerWidth - p.width - 16, Math.max(16, r.left));

    var top = r.top + r.height / 2 - p.height / 2;
    top = Math.max(78, Math.min(innerHeight - p.height - 16, top));

    read.style.transform = 'translate3d(' + Math.round(left) + 'px,' + Math.round(top) + 'px,0)';
  }
  function hideRead() { if (read) read.classList.remove('is-on'); }

  /* ---- hover: lift the cell, push its neighbours out of the way ---------------
     The comb should behave like a physical thing. Pointing at a cell nudges the
     ring around it away and dims it, so the hot cell reads as pulled forward out
     of the sheet rather than just scaled up in place. Written once per hover as
     custom properties — CSS does the easing, so there is no per-frame work. */
  var hot = null;

  function setHot(cell) {
    if (cell === hot) return;
    if (hot) clearHot();
    hot = cell;
    if (!cell) { hideRead(); return; }

    cell.el.classList.add('is-hot');
    var reach = step.x * 1.35;

    for (var i = 0; i < cells.length; i++) {
      var o = cells[i];
      if (o === cell) continue;
      var dx = o.x - cell.x, dy = o.y - cell.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d > reach || d === 0) continue;
      var f = (1 - d / reach) * 13;                 // px of push, strongest adjacent
      o.el.style.setProperty('--px', (dx / d * f).toFixed(1) + 'px');
      o.el.style.setProperty('--py', (dy / d * f).toFixed(1) + 'px');
      o.el.classList.add('is-near');
    }
    showRead(cell);
  }

  function clearHot() {
    if (hot) hot.el.classList.remove('is-hot');
    for (var i = 0; i < cells.length; i++) {
      var o = cells[i];
      if (!o.el.classList.contains('is-near')) continue;
      o.el.classList.remove('is-near');
      o.el.style.removeProperty('--px');
      o.el.style.removeProperty('--py');
    }
    hot = null;
  }

  lattice.addEventListener('pointerover', function (e) {
    var el = e.target.closest && e.target.closest('.bv-cellx');
    if (!el) return;
    var cell = cells.filter(function (c) { return c.el === el; })[0];
    if (cell) { stopPulse(); setHot(cell); }
  });
  lattice.addEventListener('pointerleave', function () { clearHot(); hideRead(); });

  /* ---- the cluster leans toward the pointer ----------------------------------
     Blended on a WRAPPER, never on the lattice itself: the lattice carries the
     `bv-revolve` CSS animation, and a running animation outranks an inline
     transform, so writing to it would be silently ignored. */
  var lean = { x: 0, y: 0, tx: 0, ty: 0 };
  var leaning = false, visible = true;

  function onMove(e) {
    if (!FINE || !RICH || !tilt) return;
    // -1..1 from the centre of the viewport
    lean.tx = (e.clientX / innerWidth - 0.5) * 2;
    lean.ty = (e.clientY / innerHeight - 0.5) * 2;
    if (!leaning) { leaning = true; requestAnimationFrame(leanStep); }
  }

  function leanStep() {
    lean.x += (lean.tx - lean.x) * 0.06;
    lean.y += (lean.ty - lean.y) * 0.06;
    // small angles: the revolve is already doing ±19°, this is a nudge on top
    tilt.style.transform =
      'rotateY(' + (lean.x * 7).toFixed(2) + 'deg) rotateX(' + (-lean.y * 5).toFixed(2) + 'deg)';
    if (visible && (Math.abs(lean.tx - lean.x) > 0.001 || Math.abs(lean.ty - lean.y) > 0.001)) {
      requestAnimationFrame(leanStep);
    } else {
      leaning = false;
    }
  }
  if (FINE && !REDUCED) addEventListener('pointermove', onMove, { passive: true });

  /* ---- idle pulse -------------------------------------------------------------
     Every few seconds a highlight walks a short path from cell to neighbouring
     cell, like honey moving through the comb. It is the thing that tells a
     reader these are touchable before they ever point at one. Cancelled the
     moment they do. */
  var pulseTimer = null, pulseWalk = null, lit = [];

  function neighbours(cell) {
    var reach = step.x * 1.35;
    return cells.filter(function (o) {
      if (o === cell) return false;
      var dx = o.x - cell.x, dy = o.y - cell.y;
      return Math.sqrt(dx * dx + dy * dy) <= reach;
    });
  }

  function stopPulse() {
    clearTimeout(pulseWalk); pulseWalk = null;
    lit.forEach(function (c) { c.el.classList.remove('is-pulse'); });
    lit = [];
  }

  function runPulse() {
    if (!RICH || hot || !visible || document.hidden) return;
    var cell = cells[Math.floor(Math.random() * cells.length)];
    var hops = 4;
    (function hop() {
      if (hot || !visible) { stopPulse(); return; }
      cell.el.classList.add('is-pulse');
      lit.push(cell);
      var c = cell;
      setTimeout(function () {
        c.el.classList.remove('is-pulse');
        lit = lit.filter(function (x) { return x !== c; });
      }, 620);
      if (--hops <= 0) return;
      var ns = neighbours(cell).filter(function (n) { return lit.indexOf(n) < 0; });
      if (!ns.length) return;
      cell = ns[Math.floor(Math.random() * ns.length)];
      pulseWalk = setTimeout(hop, 180);
    })();
  }

  function startPulse() {
    if (!RICH) return;
    stopPulseTimer();
    pulseTimer = setInterval(runPulse, 6400);
  }
  function stopPulseTimer() { if (pulseTimer) { clearInterval(pulseTimer); pulseTimer = null; } stopPulse(); }

  /* ---- turn cells over to new work ------------------------------------------ */
  var turnTimer = null;
  function startTurning() {
    if (!RICH) return;
    stopTurning();
    turnTimer = setInterval(function () {
      // never disturb a reel, and never turn the cell being pointed at
      var candidates = cells.filter(function (c) { return !c.isReel && c !== hot; });
      if (!candidates.length) return;
      var cell = candidates[Math.floor(Math.random() * candidates.length)];
      var rec = nextPiece();

      // Reuse the face's existing <img>; only the src changes. Creating a new
      // element every 2.6s for the life of the page is pure churn.
      var incoming = cell.front ? cell.b : cell.a;
      var img = incoming.querySelector('img');
      if (!img) { img = makeMedia({ src: '' }); incoming.appendChild(img); }
      img.src = rec.src;

      cell.slug = rec.slug;
      cell.el.setAttribute('data-slug', rec.slug);
      cell.el.setAttribute('aria-label', nameOf(rec.slug));

      cell.el.classList.toggle('is-turning');
      cell.front = !cell.front;
    }, 2600);
  }
  function stopTurning() { if (turnTimer) { clearInterval(turnTimer); turnTimer = null; } }

  /* ---- open the case a cell belongs to -------------------------------------- */
  lattice.addEventListener('click', function (e) {
    var cell = e.target.closest('.bv-cellx');
    if (!cell) return;
    var slug = cell.getAttribute('data-slug');
    if (!slug) return;
    // a beat of honey before the dossier grows out of the cell
    cell.classList.add('is-firing');
    setTimeout(function () { cell.classList.remove('is-firing'); }, 420);

    if (slug === SELF.slug) { SELF.go(); return; }
    if (window.BV_OPEN_CASE) window.BV_OPEN_CASE(slug, cell);
  });

  /* ---- lifecycle ------------------------------------------------------------ */
  build();
  setTimeout(function () { host.classList.add('is-in'); }, 60);
  startQueue();                  // video only after the boot screen is out of the way
  startTurning();
  startPulse();

  // Stop the whole thing when the hero is off screen, and while a picture is
  // enlarged — 20-odd cells and six videos have no business running unseen.
  var hero = document.getElementById('hero');
  if (hero && 'IntersectionObserver' in window) {
    new IntersectionObserver(function (es) {
      es.forEach(function (en) {
        visible = en.isIntersecting;
        var vids = lattice.querySelectorAll('video');
        if (visible) {
          startTurning();
          startPulse();
          pump();                       // resume any reels the reader scrolled past
          Array.prototype.forEach.call(vids, function (v) {
            var p = v.play(); if (p && p.catch) p.catch(function () {});
          });
        } else {
          stopTurning();
          stopPulseTimer();
          clearHot();
          hideRead();
          Array.prototype.forEach.call(vids, function (v) { v.pause(); });
        }
      });
    }, { threshold: 0.05 }).observe(hero);
  }

  // A background tab should cost nothing at all.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { stopTurning(); stopPulseTimer(); }
    else if (visible) { startTurning(); startPulse(); }
  });

  /* Neither should a comb sitting behind an open dossier. This is the same
     situation as the hero being scrolled away — the reader cannot see it — but
     the IntersectionObserver above never fires for it, because the hero has not
     moved: something was simply drawn on top of it. So the comb kept
     oscillating and six videos kept decoding behind a full-screen overlay.
     `covered` is tracked separately from `visible` so that closing the dossier
     restores exactly what was running before it opened, rather than starting
     the comb up while the reader is scrolled half a page down. */
  var coveredNow = false;
  document.addEventListener('bv:cover', function (e) {
    var on = !!(e.detail && e.detail.covered);
    if (on === coveredNow) return;
    coveredNow = on;
    var vids = lattice.querySelectorAll('video');
    if (on) {
      stopTurning(); stopPulseTimer(); clearHot(); hideRead();
      Array.prototype.forEach.call(vids, function (v) { v.pause(); });
    } else if (visible && !document.hidden) {
      startTurning(); startPulse(); pump();
      Array.prototype.forEach.call(vids, function (v) {
        var p = v.play(); if (p && p.catch) p.catch(function () {});
      });
    }
  });

  var rebuild = null;
  addEventListener('resize', function () {
    clearTimeout(rebuild);
    rebuild = setTimeout(function () {
      clearHot();
      hideRead();
      build();
      host.classList.add('is-in');
      startTurning();
      startPulse();
    }, 260);
  });
})();

</script>
